 <style>

    border-collapse: collapse;

    #StudentTable th {
    padding-top: 20px;

    background-color: #b22222;
    color: white;
    border: 1px solid grey;

    #StudentTable td {

    }
    #StudentTable tr:hover {

    }
    #StudentTable tr:nth-child(even){

    }
</style>
